# Forge's own mods.toml schema across every version this mod ships for (1.20.1-1.21.11): the same
# `mandatory = true` shape NeoForge's own 1.20.4 fork still carried at the point it forked from
# Forge, before NeoForge evolved its own neoforge.mods.toml. Shared by both: the loader dependency
# modid/range is templated (${loader_dep}/${loader_dep_range}) so Forge's build script can point it
# at "forge" and NeoForge's legacy (1.20.4) build can point it at "neoforge". The javafml language
# range is templated too (${loader_version_range}): NeoForge 20.4 ships javafml 2.0, Forge ships 4+.
modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${license}"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "${author}"
description = '''${description}'''
logoFile = "assets/${id}/icon.png"
displayURL = "https://github.com/FinnSetchell/LocateNext"
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.${id}]]
modId = "${loader_dep}"
mandatory = true
versionRange = "${loader_dep_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"
