modLoader = "javafml"
loaderVersion = "[4,)"
license = "${license}"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "${author}"
description = '''${description}'''
logoFile = "assets/${id}/icon.png"
displayURL = "https://github.com/FinnSetchell/LocateNext"
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.${id}]]
modId = "neoforge"
mandatory = true
versionRange = "[${neo_loader},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"
