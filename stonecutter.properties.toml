# Mod metadata and per-version dependencies.
# Gradle's own launch options stay in gradle.properties — they cannot be read from here.
#
# Tables are selected per node by `properties { tags(version, loader) }` in stonecutter.gradle.kts,
# so `deps.fabric_api` resolves to whatever the matching [fabric."<version>"] table declares.

mod.id = "locatenext"
mod.name = "LocateNext"
# Artifact stem for the fleet filename convention {ModName}-{loader}-{mc}-{version}.jar.
mod.archive_name = "LocateNext"
mod.group = "com.finndog.locatenext"
mod.version = "1.3.0"
mod.author = "FinnSetchell"
mod.license = "MIT"
mod.description = "A structure-testing dev tool: pick a mod, then arrow-key your way through every structure it adds, locating and teleporting to each in turn."

# Loom variant for the obfuscated (pre-26.1) versions, applied by dev.kikugie.loom-back-compat.
# From 26.1 Minecraft ships unobfuscated and the plugin swaps to plain fabric-loom automatically.
loomx.loom_version = "1.17-SNAPSHOT"

# The loader the dev environment runs against.
deps.fabric_loader = "0.19.3"
# The floor declared in fabric.mod.json, which is a different question — it has to be low enough
# for the launcher instances the jar gets dropped into. Keeping these separate is deliberate:
# declaring the dev loader version silently locked the mod out of a CurseForge instance pinned to
# 0.19.2. Nothing here needs more than the 1.20.5-era payload API, so the floor sits well below.
mod.loader_min = "0.16.0"

# ------------------------------------------------------------------ 1.20.1 (Java 17)
["1.20.1"]
mod.mc_releases = ["1.20.1"]
mod.pack_format = "15"
mod.java = "17"

[fabric."1.20.1"]
mod.mc_compat = "~1.20.1"
deps.fabric_api = "0.92.11+1.20.1"
deps.modmenu = ""

# Forge's own line never stopped at the NeoForge fork, so it covers 1.20.1 too. Oldest and most
# different of the eight Forge nodes: predates Forge's own 1.20.2 networking rewrite (SimpleChannel,
# not the RegisterPayloadHandlerEvent registrar), and predates vanilla's CustomPacketPayload.
[forge."1.20.1"]
mod.mc_compat = "[1.20.1, 1.20.2)"
deps.forge_version = "47.4.10"

# ------------------------------------------------------------------ 1.20.4 (Java 17)
# NeoForge's earliest supported version, since it forked from Forge here. Pre-1.20.5, so its
# payloads use the older networking path, not CustomPacketPayload.
["1.20.4"]
mod.mc_releases = ["1.20.4"]
mod.pack_format = "22"
mod.java = "17"

[fabric."1.20.4"]
mod.mc_compat = "~1.20.4"
deps.fabric_api = "0.97.3+1.20.4"
deps.modmenu = ""

[neoforge."1.20.4"]
mod.mc_compat = "[1.20.4, 1.20.5)"
deps.neo_loader = "20.4.251"

[forge."1.20.4"]
mod.mc_compat = "[1.20.4, 1.20.5)"
deps.forge_version = "49.2.0"

# ------------------------------------------------------------------ 1.20.6 (Java 21)
# 1.20.5 raised the floor to Java 21 and shares this pack format with 1.20.6.
["1.20.6"]
mod.mc_releases = ["1.20.5", "1.20.6"]
mod.pack_format = "32"
mod.java = "21"

[fabric."1.20.6"]
mod.mc_compat = "~1.20.6"
deps.fabric_api = "0.100.8+1.20.6"
deps.modmenu = "10.0.0"

[neoforge."1.20.6"]
mod.mc_compat = "[1.20.6, 1.20.7)"
deps.neo_loader = "20.6.139"

[forge."1.20.6"]
mod.mc_compat = "[1.20.6, 1.20.7)"
deps.forge_version = "50.2.0"

# ------------------------------------------------------------------ 1.21.1 (Java 21)
["1.21.1"]
mod.mc_releases = ["1.21", "1.21.1"]
mod.pack_format = "34"
mod.java = "21"

[fabric."1.21.1"]
mod.mc_compat = "~1.21.1"
deps.fabric_api = "0.116.14+1.21.1"
# compileOnly — Mod Menu is never bundled, and the mod runs fine without it.
deps.modmenu = "11.0.3"

[neoforge."1.21.1"]
mod.mc_compat = "[1.21, 1.21.2)"
deps.neo_loader = "21.1.249"

[forge."1.21.1"]
mod.mc_compat = "[1.21, 1.21.2)"
deps.forge_version = "52.1.0"

# ------------------------------------------------------------------ 1.21.3 (Java 21)
# 1.21.2 shares this pack format with 1.21.3.
["1.21.3"]
mod.mc_releases = ["1.21.2", "1.21.3"]
mod.pack_format = "42"
mod.java = "21"

[fabric."1.21.3"]
mod.mc_compat = "~1.21.3"
deps.fabric_api = "0.114.1+1.21.3"
deps.modmenu = "12.0.1"

[neoforge."1.21.3"]
mod.mc_compat = "[1.21.3, 1.21.4)"
deps.neo_loader = "21.3.97"

[forge."1.21.3"]
mod.mc_compat = "[1.21.3, 1.21.4)"
deps.forge_version = "53.1.0"

# ------------------------------------------------------------------ 1.21.4 (Java 21)
["1.21.4"]
mod.mc_releases = ["1.21.4"]
mod.pack_format = "46"
mod.java = "21"

[fabric."1.21.4"]
mod.mc_compat = "~1.21.4"
deps.fabric_api = "0.119.4+1.21.4"
deps.modmenu = "13.0.4"

[neoforge."1.21.4"]
mod.mc_compat = "[1.21.4, 1.21.5)"
deps.neo_loader = "21.4.157"

[forge."1.21.4"]
mod.mc_compat = "[1.21.4, 1.21.5)"
deps.forge_version = "54.1.14"

# ------------------------------------------------------------------ 1.21.5 (Java 21)
["1.21.5"]
mod.mc_releases = ["1.21.5"]
mod.pack_format = "55"
mod.java = "21"

[fabric."1.21.5"]
mod.mc_compat = "~1.21.5"
deps.fabric_api = "0.128.2+1.21.5"
deps.modmenu = "14.0.2"

[neoforge."1.21.5"]
mod.mc_compat = "[1.21.5, 1.21.6)"
deps.neo_loader = "21.5.98"

[forge."1.21.5"]
mod.mc_compat = "[1.21.5, 1.21.6)"
deps.forge_version = "55.1.0"

# ------------------------------------------------------------------ 1.21.11 (Java 21)
# Carries the 1.21.11 renames (ResourceLocation -> Identifier, ResourceKey#location ->
# #identifier, the Commands permission set) but sits BELOW 26.1's GUI and key-mapping rework.
["1.21.11"]
mod.mc_releases = ["1.21.11"]
mod.pack_format = "75"
mod.java = "21"

[fabric."1.21.11"]
mod.mc_compat = "~1.21.11"
deps.fabric_api = "0.141.5+1.21.11"
deps.modmenu = ""

[neoforge."1.21.11"]
mod.mc_compat = "[1.21.11, 1.21.12)"
deps.neo_loader = "21.11.45"

# Forge 1.21.6+ shipped EventBus 7, a genuinely different mod-bus API (bus groups, compile-time
# validated @SubscribeEvent) from every older Forge node above — see forge/LocateNextForgeEventBus7.
[forge."1.21.11"]
mod.mc_compat = "[1.21.11, 1.21.12)"
deps.forge_version = "61.2.0"

# ------------------------------------------------------------------ 26.1.2 (Java 25, unobfuscated)
["26.1.2"]
mod.mc_releases = ["26.1", "26.1.1", "26.1.2"]
mod.pack_format = "84"
mod.java = "25"

[fabric."26.1.2"]
mod.mc_compat = "~26.1"
deps.fabric_api = "0.155.2+26.1.2"
deps.modmenu = ""

# ------------------------------------------------------------------ 26.2 (Java 25, unobfuscated)
# From 26.1 Minecraft ships unobfuscated, so loom-back-compat swaps to plain fabric-loom here and
# `loomx.applyMojangMappings()` becomes a no-op.
["26.2"]
mod.mc_releases = ["26.2"]
mod.pack_format = "88"
mod.java = "25"

[fabric."26.2"]
mod.mc_compat = "~26.2"
# Matches the fabric-api in the 26.2 CurseForge instance this is deployed to.
deps.fabric_api = "0.157.0+26.2"
# Blank = no Mod Menu integration on this version. Mod Menu's 26.x artifact still carries
# intermediary references that Loom does not remap against an un-obfuscated Minecraft, so
# compiling against it fails on `class_437`. The integration is a convenience (its config button
# opens the picker), so 26.2 simply ships without it rather than holding the port up.
deps.modmenu = ""
